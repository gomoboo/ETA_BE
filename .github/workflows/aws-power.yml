name: AWS server power
on:
  workflow_dispatch:
    inputs:
      action:
        description: Server action
        type: choice
        options: [status, start, stop]
        default: status
        required: true
  schedule:
    # 00:00 Asia/Seoul. Inactive unless repository variable AUTO_STOP_ENABLED=true.
    - cron: '0 15 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: eta-aws-server
  cancel-in-progress: false
jobs:
  power:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AUTO_STOP_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ACTION: ${{ github.event_name == 'schedule' && 'stop' || inputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check repository configuration
        run: |
          test -n "$AWS_REGION" && test -n "$AWS_INSTANCE_ID" && test -n "$AWS_ROLE_ARN" || {
            echo 'Configure AWS_REGION, AWS_INSTANCE_ID and AWS_ROLE_ARN repository variables from Terraform outputs.'
            exit 1
          }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Control server
        run: python3 infra/scripts/aws_server.py "$ACTION"
