name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # 테스트마다 임시 SQLite DB와 fakeredis를 사용하므로 외부 서비스가 필요 없음
      - run: pytest -q

  migrations-postgres:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eta
          POSTGRES_PASSWORD: eta
          POSTGRES_DB: eta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://eta:eta@localhost:5432/eta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # 운영 DB(PostgreSQL)에서 전체 적용 → 전체 되돌리기 → 재적용, 모델과 DB 일치 여부 확인
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check

  docker:
    name: Docker (build & health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 이미지 빌드 → API + PostgreSQL + Redis 기동(시작 시 마이그레이션 적용) → 헬스체크
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: curl -fsS http://localhost:8000/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  infrastructure:
    name: Infrastructure (Terraform & scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.1"
      - run: terraform -chdir=infra/aws fmt -check -recursive
      - run: terraform -chdir=infra/aws init -backend=false -input=false
      - run: terraform -chdir=infra/aws validate
      - run: terraform -chdir=infra/aws test
      - run: shellcheck infra/scripts/*.sh
      - name: Validate server Compose without loading secret files
        env:
          POSTGRES_PASSWORD: ci-placeholder
        run: docker compose -f infra/docker/compose.yml config --quiet --no-env-resolution
